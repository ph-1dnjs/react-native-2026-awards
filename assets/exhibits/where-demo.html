<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>어디쯤 모션 시안</title><style>body{margin:0;background:#f5f6f2}</style></head><body>
<div id="pixel-scale-boot-sequence" class="viz-dotted-background" aria-label="지구본에서 동네 지도까지 빠르게 확대되는 위치 공유 시작 모션 시안">
  <style>
    @font-face { font-family: PixelMapFont; src: url('./NeoDunggeunmoPro-Regular.woff2') format('woff2'); font-weight: 400; font-display: swap; }
    #pixel-scale-boot-sequence {
      --pb-ink: light-dark(#0e1b3d, #e8eefa);
      --pb-muted: light-dark(#5b6b8c, #9aa8c7);
      --pb-line: light-dark(#dce3ed, #31416b);
      --pb-paper: light-dark(#f5f6f2, #0a1430);
      color-scheme: light dark;
      color: var(--pb-ink);
      font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
      padding: 1rem .55rem 1.3rem;
    }
    #pixel-scale-boot-sequence * { box-sizing: border-box; }
    #pixel-scale-boot-sequence .pb-wrap { width: min(100%, 440px); margin: 0 auto; }
    #pixel-scale-boot-sequence .pb-topline {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      margin: 0 2px 12px; font-size: 12px; letter-spacing: .01em;
    }
    #pixel-scale-boot-sequence .pb-kicker { color: var(--pb-muted); font-weight: 750; }
    #pixel-scale-boot-sequence .pb-duration {
      border: 1px solid var(--pb-line); border-radius: 999px; padding: 4px 9px;
      color: var(--pb-muted); font: 700 10px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .06em;
    }
    #pixel-scale-boot-sequence .pb-device {
      position: relative; width: min(100%, 376px); margin: 0 auto; padding: 8px;
      overflow: hidden; border: 1px solid light-dark(#d4dce7, #26355c); border-radius: 29px;
      background: light-dark(#e8edf4, #060d20);
      box-shadow: 0 18px 44px light-dark(rgba(14,27,61,.13), rgba(0,0,0,.38));
    }
    #pixel-scale-boot-sequence .pb-screen {
      position: relative; width: 100%; aspect-ratio: 360 / 780; overflow: hidden;
      border-radius: 21px; background: #fbfbf7; isolation: isolate;
    }
    #pixel-scale-boot-sequence .pb-map-layer {
      position: absolute; z-index: 1; inset: 0; overflow: hidden;
      clip-path: circle(var(--pb-reveal, 0px) at calc(100% - 56px) calc(100% - 56px));
      will-change: clip-path;
    }
    #pixel-scale-boot-sequence #pb-map {
      position: absolute; inset: 0; display: block; width: 100%; height: 100%;
      image-rendering: pixelated;
    }
    #pixel-scale-boot-sequence .pb-location-ripple {
      position: absolute; z-index: 2; left: 50%; top: 50%; width: 8px; height: 8px;
      transform: translate(-50%,-50%); opacity: 0; pointer-events: none;
    }
    #pixel-scale-boot-sequence .pb-ripple-dot {
      position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; border-radius: 50%;
      transform: translate(-50%,-50%); background: #2ee6b6; box-shadow: 0 0 0 3px #0e1b3d, 0 0 12px #2ee6b6;
    }
    #pixel-scale-boot-sequence .pb-ripple-ring {
      position: absolute; left: 50%; top: 50%; width: 30px; height: 30px; border: 2px solid #2ee6b6;
      border-radius: 50%; transform: translate(-50%,-50%) scale(.2); opacity: 0;
    }
    #pixel-scale-boot-sequence .pb-member-marker {
      position: absolute; left: 50%; top: 50%; z-index: 3; width: 25px; height: 27.5px;
      line-height: 0; opacity: 0; transform: translate(-50%, calc(-100% - 140px));
      will-change: transform, opacity; pointer-events: none;
    }
    #pixel-scale-boot-sequence .pb-member-marker svg {
      display: block; width: 100%; height: 100%; overflow: visible;
      filter: drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 1px 2px rgb(14 27 61 / .35));
    }
    #pixel-scale-boot-sequence .pb-real-share {
      position: absolute; z-index: 3; right: 20px; bottom: 20px; width: 72px; height: 72px;
      padding: 0; border: 0; border-radius: 50%; background: #0e1b3d;
      box-shadow: 0 12px 32px rgb(14 27 61 / .18); transition: transform .12s;
      pointer-events: none;
    }
    #pixel-scale-boot-sequence .pb-real-share svg { position: absolute; inset: 0; display: block; width: 100%; height: 100%; pointer-events: none; }
    #pixel-scale-boot-sequence .pb-real-share .fab-pin-dim { opacity: 0; }
    #pixel-scale-boot-sequence .pb-real-share .fab-pin-fill { clip-path: inset(var(--pb-pin-top, 0%) 0 0 0); }
    #pixel-scale-boot-sequence .pb-real-share.is-filling { background: rgb(14 27 61 / .6); }
    #pixel-scale-boot-sequence .pb-real-share.is-filling .fab-pin-dim { opacity: .25; }
    #pixel-scale-boot-sequence .pb-real-share.is-pressed { transform: scale(.94); }
    #pixel-scale-boot-sequence .pb-real-share .fab-waves { z-index: 1; }
    #pixel-scale-boot-sequence .pb-real-share .fab-pin { z-index: 2; }
    #pixel-scale-boot-sequence .pb-real-share .wave-arc {
      fill: none; stroke: #2ee6b6; stroke-width: 3; stroke-dasharray: 1; stroke-dashoffset: 0;
    }
    #pixel-scale-boot-sequence .pb-real-share .wave-outer { stroke-opacity: .35; }
    #pixel-scale-boot-sequence .pb-real-share .wave-inner { stroke-opacity: .7; }
    #pixel-scale-boot-sequence .pb-real-share .share-pulse {
      position: absolute; z-index: 0; inset: 0; border-radius: 50%; border: 2px solid #2ee6b6;
      box-sizing: border-box; opacity: 0; animation: pb-share-pulse 2.4s ease-out infinite;
    }
    #pixel-scale-boot-sequence .pb-real-share .share-pulse + .share-pulse { animation-delay: 1.2s; }
    #pixel-scale-boot-sequence .pb-real-share.is-filling .share-pulse,
    #pixel-scale-boot-sequence .pb-real-share.is-done .share-pulse { animation: none; opacity: 0; }
    #pixel-scale-boot-sequence .pb-real-share.is-done { animation: pb-boot-bounce .25s ease-out 1; }
    #pixel-scale-boot-sequence .pb-touch {
      position: absolute; z-index: 4; right: 46px; bottom: 46px; width: 20px; height: 20px;
      border: 2px solid #2ee6b6; border-radius: 50%; opacity: 0; transform: scale(.25);
      pointer-events: none;
    }
    #pixel-scale-boot-sequence .pb-finger {
      position: absolute; z-index: 5; right: 44px; bottom: 40px; width: 24px; height: 32px;
      opacity: 0; transform: translate(16px, 14px); pointer-events: none;
    }
    #pixel-scale-boot-sequence .pb-finger svg { display: block; width: 100%; height: 100%; overflow: visible; }
    #pixel-scale-boot-sequence .pb-finger.is-active { animation: pb-finger-tap .62s ease-in-out both; }
    #pixel-scale-boot-sequence .pb-touch.is-active { animation: pb-touch-pop .48s ease-out both; }
    #pixel-scale-boot-sequence .pb-speaker {
      position: absolute; z-index: 6; top: 12px; left: 50%; width: 70px; height: 15px;
      transform: translateX(-50%); border-radius: 10px; background: #e9edf3; pointer-events: none;
    }
    #pixel-scale-boot-sequence .pb-caption {
      margin: 14px 4px 0; min-height: 42px; color: var(--pb-ink); font-size: 13px;
      font-weight: 650; line-height: 1.55; text-align: center;
    }
    #pixel-scale-boot-sequence .pb-timeline {
      display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px;
      margin: 14px 2px 10px;
    }
    #pixel-scale-boot-sequence .pb-step {
      position: relative; padding-top: 12px; color: var(--pb-muted); font-size: 9px;
      line-height: 1.3; text-align: center; white-space: nowrap;
    }
    #pixel-scale-boot-sequence .pb-step::before {
      content: ""; position: absolute; top: 1px; left: 50%; width: 6px; height: 6px;
      transform: translateX(-50%); border: 1px solid var(--pb-muted); background: var(--pb-paper);
    }
    #pixel-scale-boot-sequence .pb-step.is-active { color: var(--pb-ink); font-weight: 800; }
    #pixel-scale-boot-sequence .pb-step.is-active::before,
    #pixel-scale-boot-sequence .pb-step.is-done::before {
      border-color: #0fa982; background: #2ee6b6;
    }
    #pixel-scale-boot-sequence .pb-replay {
      display: flex; align-items: center; justify-content: center; gap: 8px; width: fit-content;
      margin: 0 auto; padding: 9px 14px; border: 1px solid var(--pb-line); border-radius: 999px;
      color: var(--pb-ink); background: var(--pb-paper); font: inherit; font-size: 12px; font-weight: 750;
      cursor: pointer; transition: transform .16s ease, border-color .16s ease;
    }
    #pixel-scale-boot-sequence .pb-replay:hover { border-color: #0fa982; }
    #pixel-scale-boot-sequence .pb-replay:active { transform: scale(.97); }
    #pixel-scale-boot-sequence .pb-replay:focus-visible { outline: 3px solid #0fa982; outline-offset: 3px; }
    #pixel-scale-boot-sequence .pb-replay svg { width: 14px; height: 14px; }
    #pixel-scale-boot-sequence .pb-note {
      margin: 10px 8px 0; color: var(--pb-muted); font-size: 10px; line-height: 1.5; text-align: center;
    }
    @keyframes pb-share-pulse { 0% { transform: scale(1); opacity: .5; } 70%,100% { transform: scale(1.55); opacity: 0; } }
    @keyframes pb-boot-bounce { 0%,100% { transform: scale(1); } 40% { transform: scale(1.08); } 70% { transform: scale(.985); } }
    @keyframes pb-finger-tap {
      0% { opacity: 0; transform: translate(16px,14px); }
      22% { opacity: 1; transform: translate(5px,5px); }
      48% { opacity: 1; transform: translate(0,0); }
      66% { opacity: 1; transform: translate(0,3px); }
      100% { opacity: 0; transform: translate(-2px,-3px); }
    }
    @keyframes pb-touch-pop {
      0% { opacity: .8; transform: scale(.3); }
      100% { opacity: 0; transform: scale(2.4); }
    }
    @media (prefers-reduced-motion: reduce) {
      #pixel-scale-boot-sequence .pb-real-share .share-pulse { animation: none; }
      #pixel-scale-boot-sequence .pb-real-share.is-done,
      #pixel-scale-boot-sequence .pb-finger.is-active,
      #pixel-scale-boot-sequence .pb-touch.is-active { animation: none; }
    }
  </style>
<style>
html,body{width:100%;height:100%;overflow:hidden}
#pixel-scale-boot-sequence{width:100%;height:100%;padding:0}
#pixel-scale-boot-sequence .pb-wrap,#pixel-scale-boot-sequence .pb-device{width:100%;height:100%;max-width:none;margin:0;padding:0;border:0;border-radius:0;box-shadow:none}
#pixel-scale-boot-sequence .pb-screen{width:100%;height:100%;aspect-ratio:auto;border-radius:0}
#pixel-scale-boot-sequence .pb-topline,#pixel-scale-boot-sequence .pb-timeline,#pixel-scale-boot-sequence .pb-caption,#pixel-scale-boot-sequence .pb-replay,#pixel-scale-boot-sequence .pb-note{display:none}
</style>

  <section class="pb-wrap" aria-label="지구본에서 동네까지 빠르게 확대되는 모션 미리보기">
    <div class="pb-topline">
      <span class="pb-kicker">빠른 확대 버전 · 지구본에서 동네까지</span>
      <span class="pb-duration">REVERSE ZOOM / 5.3 SEC</span>
    </div>
    <div class="pb-device">
      <div class="pb-screen" id="pb-screen">
        <div class="pb-map-layer" id="pb-map-layer" aria-hidden="true">
          <canvas id="pb-map" width="360" height="780"></canvas>
          <div class="pb-location-ripple" id="pb-location-ripple" aria-hidden="true">
            <span class="pb-ripple-ring"></span><span class="pb-ripple-ring"></span><span class="pb-ripple-dot"></span>
          </div>
          <div class="pb-member-marker" id="pb-member-marker"></div>
        </div>
        <button class="pb-real-share" id="pb-real-share" type="button" aria-hidden="true" tabindex="-1">
          <span class="share-pulse" aria-hidden="true"></span><span class="share-pulse" aria-hidden="true"></span>
          <svg class="fab-waves" viewBox="0 0 108 108" aria-hidden="true">
            <g transform="translate(0 -5.5)">
              <path class="wave-arc wave-outer" pathLength="1" d="M54 70A36 10 0 0 1 54 90"/>
              <path class="wave-arc wave-outer" pathLength="1" d="M54 70A36 10 0 0 0 54 90"/>
              <path class="wave-arc wave-inner" pathLength="1" d="M54 74.5A20 5.5 0 0 1 54 85.5"/>
              <path class="wave-arc wave-inner" pathLength="1" d="M54 74.5A20 5.5 0 0 0 54 85.5"/>
            </g>
          </svg>
          <svg class="fab-pin fab-pin-dim" viewBox="0 0 108 108" aria-hidden="true">
            <g transform="translate(0 -5.5)"><g transform="translate(27.6 25) scale(2.2)">
              <path fill="#2ee6b6" d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/>
            </g></g>
          </svg>
          <svg class="fab-pin fab-pin-fill" viewBox="0 0 108 108" aria-hidden="true">
            <g transform="translate(0 -5.5)"><g transform="translate(27.6 25) scale(2.2)">
              <path fill="#2ee6b6" d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/>
            </g></g>
          </svg>
        </button>
        <div class="pb-touch" id="pb-touch" aria-hidden="true"></div>
        <div class="pb-finger" id="pb-finger" aria-hidden="true">
          <svg viewBox="0 0 24 32" shape-rendering="crispEdges">
            <path d="M7 3h5v11h2v-3h3v4h2v-2h2v4h2v7l-5 7H8l-5-7v-8h4v-2z" fill="#fffaf0" stroke="#0e1b3d" stroke-width="2"/>
            <path d="M8 5h2v9H8z" fill="#2ee6b6"/>
          </svg>
        </div>
        <div class="pb-speaker" aria-hidden="true"></div>
      </div>
    </div>
    <div class="pb-timeline" aria-hidden="true">
      <span class="pb-step is-active">대기</span><span class="pb-step">탭</span><span class="pb-step">지구</span>
      <span class="pb-step">펄스</span><span class="pb-step">서울</span><span class="pb-step">동네</span><span class="pb-step">완료</span>
    </div>
    <p class="pb-caption" id="pb-caption" aria-live="polite">위치 보내기 버튼을 누르면 지구본이 나타납니다.</p>
    <button class="pb-replay" id="pb-replay" type="button">
      <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 6a5.4 5.4 0 1 1-.3 3.2M3 2.5V6h3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      처음부터 다시 보기
    </button>
    <p class="pb-note">펄스와 토끼 등장 뒤 광화문 동네까지 빠르게 확대되는 별도 시안입니다. 실제 초기화 로직에는 연결되지 않았습니다.</p>
  </section>

      const BUILDING_COLORS = {R:'#f59a45',K:'#0e1b3d',W:'#d4ad9b',C:'#68bde1',D:'#8a6d62',L:'#fffaf0',G:'#70b966',F:'#b9df88',T:'#915e40'};

      const regionalRoads = [
        [[126.2,37.15],[126.45,37.35],[126.65,37.48],[126.92,37.53],[127.18,37.55],[127.48,37.67],[127.72,37.88]],
        [[126.55,36.9],[126.74,37.13],[126.98,37.28],[127.1,37.51],[127.15,37.83],[127.34,38.13],[127.56,38.39]],
        [[126.0,37.52],[126.35,37.57],[126.67,37.6],[127.0,37.57],[127.36,37.64],[127.72,37.7]],
        [[126.3,36.1],[126.55,36.55],[126.78,36.92],[127.0,37.16],[127.05,37.45]],

      const regionalWater = [

        [[126.79,37.62],[126.84,37.57],[126.91,37.54],[126.98,37.51],[127.04,37.47],[127.09,37.42]],

      function tracePoints(points, scale) {
        let open = false;

      }
      function drawLocalPolygons(scale) {

      function drawPixelBuildings(scale) {

        for (const b of localBuildings) {

      function drawRoad(points, widthKm, fill, edge, scale) {

      function drawRegional(scale) {
        regionalRoads.forEach(points => drawRoad(points.map(([lon,lat]) => [lat,lon]), .07, MAIN_ROAD, MAIN_EDGE, scale));
        regionalWater.forEach(points => drawRoad(points.map(([lon,lat]) => [lat,lon]), .34, SEA, '#4d9ebf', scale));
      }

      function sampleGeoTexture(lon, lat, out) {
        const fx = (lon + 180) / 360 * TEXTURE_W - .5;
        const fy = (90 - lat) / 180 * TEXTURE_H - .5;
        const ix = Math.floor(fx), iy = Math.floor(fy);
        const tx = fx - ix, ty = fy - iy;
        const x0 = (ix % TEXTURE_W + TEXTURE_W) % TEXTURE_W, x1 = (x0 + 1) % TEXTURE_W;

        const a = w00*a00 + w10*a10 + w01*a01 + w11*a11;

        out[1] = (w00*a00*landTexture[i00+1] + w10*a10*landTexture[i10+1] + w01*a01*landTexture[i01+1] + w11*a11*landTexture[i11+1]) + seaG*(1-a);
        out[2] = (w00*a00*landTexture[i00+2] + w10*a10*landTexture[i10+2] + w01*a01*landTexture[i01+2] + w11*a11*landTexture[i11+2]) + seaB*(1-a);
        out[3] = a;
      }
      function drawSurface(scale, time) {
        const radius = EARTH_KM * scale;
        if (scale > 24) {
          ctx.fillStyle = LAND; ctx.fillRect(0, 0, W, H);
          return radius;
        }
        const pixels = surfaceImage.data;
        const invR = 1 / radius;
        const sampled = [0,0,0,0], shoreRgb = [167,213,183];
        for (let y = 0; y < H; y++) {
          const ny = (CY - (y + .5)) * invR;
          for (let x = 0; x < W; x++) {
            const i = (y * W + x) * 4;
            const nx = ((x + .5) - CX) * invR;
            const d2 = nx * nx + ny * ny;
            if (d2 >= 1) {
              pixels[i] = 7; pixels[i+1] = 18; pixels[i+2] = 39; pixels[i+3] = 255;
              continue;
            }
            const nz = Math.sqrt(1 - d2);
            const lat = Math.asin(ny * COS0 + nz * SIN0) / DEG;
            const lon = (LON0 + Math.atan2(nx, nz * COS0 - ny * SIN0)) / DEG;
            sampleGeoTexture(lon,lat,sampled);
            const shore = .24 * 4 * sampled[3] * (1-sampled[3]);
            const baseR = lerp(sampled[0],shoreRgb[0],shore);
            const baseG = lerp(sampled[1],shoreRgb[1],shore);
            const baseB = lerp(sampled[2],shoreRgb[2],shore);
            const light = clamp(.52 + .48 * ((.35 * -nx + .2 * ny + .9 * nz) / .9), .38, 1);
            pixels[i] = Math.round(baseR * light);
            pixels[i+1] = Math.round(baseG * light);
            pixels[i+2] = Math.round(baseB * light);
            pixels[i+3] = 255;
          }
        }
        ctx.putImageData(surfaceImage, 0, 0);
        if (radius < 650) {
          ctx.beginPath(); ctx.arc(CX, CY, radius, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(163,220,235,.8)'; ctx.lineWidth = 2; ctx.stroke();
          ctx.beginPath(); ctx.arc(CX, CY, radius - 2, -.58, .28);
          ctx.strokeStyle = 'rgba(255,255,255,.24)'; ctx.lineWidth = 1; ctx.stroke();
        }
        const stars = STAR_FIELD;
        for (const s of stars) {
          if (Math.hypot(s.x-CX,s.y-CY) <= radius + 4) continue;
          ctx.fillStyle = s.color; ctx.fillRect(s.x,s.y,s.size,s.size);
        }
        return radius;
      }
      const STAR_FIELD = [];
      for (let i = 0; i < 94; i++) {
        const x = (i * 73 + 17) % W, y = (i * 131 + 29) % H;
        const v = (i * 29) % 4;
        STAR_FIELD.push({x,y,size:v===0?2:1,color:v===0?'#95b6d4':'#6d86a8'});
      }

      const ICONS = {};
      function buildIcons() {
        for (const type of Object.keys(ASSETS.icons)) {
          const icon = document.createElement('canvas'); icon.width = 32; icon.height = 32;
          const ictx = icon.getContext('2d');
          const image = ictx.createImageData(32, 32);
          const encoded = ASSETS.icons[type];
          for (let i = 0; i < 1024; i++) {
            const code = encoded[i]; if (code === '.') continue;
            const color = ASSETS.palette[parseInt(code, 36)];
            const p = i * 4;
            image.data[p] = parseInt(color.slice(1,3),16);
            image.data[p+1] = parseInt(color.slice(3,5),16);
            image.data[p+2] = parseInt(color.slice(5,7),16);
            image.data[p+3] = 255;
          }
          ictx.putImageData(image,0,0);
          const sticker = document.createElement('canvas'); sticker.width = 36; sticker.height = 36;
          const sctx = sticker.getContext('2d');
          const border = sctx.createImageData(36,36);
          for (let y = 0; y < 36; y++) for (let x = 0; x < 36; x++) {
            const sx = x-2, sy = y-2;
            let nearest = 3;
            for (let dy = -2; dy <= 2 && nearest > 0; dy++) for (let dx = -2; dx <= 2 && nearest > 0; dx++) {
              const px = sx+dx, py = sy+dy;
              if (px < 0 || px >= 32 || py < 0 || py >= 32) continue;
              if (image.data[(py*32+px)*4+3]) nearest = Math.min(nearest,Math.max(Math.abs(dx),Math.abs(dy)));

            const color = nearest === 1 ? [255,250,240,255] : nearest === 2 ? [14,27,61,255] : null;

        }
      }
      function drawLandmarks(scale) {
        const alpha = smooth((.2 - scale) / .15);
        if (alpha <= 0) return;
        const placed = [];
        ctx.save(); ctx.globalAlpha = alpha; ctx.imageSmoothingEnabled = false;
        for (const [name, type, lat, lon] of ASSETS.landmarks) {
          const p = projectGeo(lat, lon, scale);
          if (p.z <= .01 || p.x < -40 || p.x > W+40 || p.y < -40 || p.y > H+40) continue;
          if (p.x > 150 && p.x < 210 && p.y > 346 && p.y < 407) continue;
          if (placed.some(q => Math.hypot(q.x-p.x,q.y-p.y) < 43)) continue;

      }
      const NEIGHBORHOOD_LANDMARKS = [
        ['광화문','gate',37.57593,126.97682],
        ['경복궁','palace',37.57975,126.97668],

      function drawNeighborhoodLandmarks(scale) {
        const alpha = smooth((scale - 12) / 24);
        if (alpha <= 0) return;
        ctx.save(); ctx.globalAlpha = alpha; ctx.imageSmoothingEnabled = false;

      }
      function createAvatarSvg() {
        const rows = ['.##..##.','.##..##.','.##..##.','########','##o##o##','########','.######.','........'];
        const filled = (x,y) => y >= 0 && y < 8 && x >= 0 && x < 8 && rows[y][x] !== '.';
        let rects = '';
        for (let y = 0; y < 10; y++) for (let x = 0; x < 10; x++) {
          const ch = rows[y-1] ? rows[y-1][x-1] : '.';
          let fill = '';
          if (ch === '#') fill = '#A8B4C8';
          else if (ch === 'o') fill = '#0E1B3D';
          else {
            let near = false;
            for (let dy = -1; dy <= 1 && !near; dy++) for (let dx = -1; dx <= 1 && !near; dx++) near = filled(x-1+dx,y-1+dy);
            if (near) fill = '#0E1B3D';
          }
          if (fill) rects += '<rect x="' + x + '" y="' + y + '" width="1" height="1" fill="' + fill + '"/>';
        }
        rects += '<rect x="3" y="10" width="4" height="1" fill="#0E1B3D"/>';
        return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 11" shape-rendering="crispEdges" role="img" aria-label="나">' + rects + '</svg>';
      }
      document.getElementById('pb-member-marker').innerHTML = createAvatarSvg();

      const TAP_AT = .78, REVEAL_END = 1.36, PULSE_AT = 1.55, DROP_AT = 2.35;
      const duration = 4.25, zoomStart = 2.78, zoomEnd = 3.78;
      const CLIP_FRAMES = [[0,62.9],[9.667,52.9],[19.333,48.5],[29,44.9],[38.667,41.9],[48.333,38.9],[58,36.2],[67.667,33.4],[77.333,30.5],[87,27.2],[96.667,22.1],[100,22.1]];
      function pinTop(progress) {
        const q = clamp(progress) * 100;
        for (let i = 0; i < CLIP_FRAMES.length - 1; i++) {
          const a = CLIP_FRAMES[i], b = CLIP_FRAMES[i+1];
          if (q <= b[0]) return lerp(a[1],b[1],(q-a[0])/(b[0]-a[0]));

      function buttonProgress(t) {
        const fillStart = TAP_AT, fillEnd = zoomEnd, finalBeat = .36;

        if (t < earlyEnd) return .9 * (t - fillStart) / (earlyEnd - fillStart);

      function updateButton(t) {
        const fillStart = TAP_AT, fillEnd = zoomEnd;
        const q = buttonProgress(t);
        const filling = t >= fillStart && t < fillEnd;
        button.classList.toggle('is-pressed', t >= TAP_AT && t < TAP_AT + .15);
        button.classList.toggle('is-filling', filling);
        button.classList.toggle('is-done', t >= fillEnd);
        const top = filling ? pinTop(q) : t >= fillEnd ? 22.1 : 0;
        button.style.setProperty('--pb-pin-top', top + '%');
        const outer = filling ? (q < .96667 ? 0 : clamp((q-.96667)/.02)) : 1;
        const inner = filling ? (q < .98 ? 0 : clamp((q-.98)/.02)) : 1;
        wavePaths.forEach((path,i) => path.style.strokeDashoffset = 1 - (i < 2 ? outer : inner));
      }
      function markerSpring(seconds) {
        const zeta = .48, omega = 13.5;
        const wd = omega * Math.sqrt(1 - zeta * zeta);
        return 1 - Math.exp(-zeta * omega * seconds) *
          (Math.cos(wd * seconds) + (zeta / Math.sqrt(1 - zeta * zeta)) * Math.sin(wd * seconds));
      }
      function updateMarker(t) {
        const rippleAt = PULSE_AT, dropAt = DROP_AT;
        locationRipple.style.left = CX + 'px'; locationRipple.style.top = CY + 'px';
        marker.style.left = CX + 'px'; marker.style.top = CY + 'px';
        const dropping = t >= dropAt;
        locationRipple.style.opacity = t >= rippleAt && t < dropAt + .2 ? '1' : '0';
        rippleDot.style.opacity = t >= rippleAt && !dropping ? '1' : '0';
        rippleRings.forEach((ring,i) => {
          const p = (t - rippleAt - i * .17) / .58;
          const q = clamp(p);
          ring.style.transform = 'translate(-50%,-50%) scale(' + (.2 + q * 2.1) + ')';
          ring.style.opacity = p < 0 || p >= 1 ? '0' : String(1 - q);

      }
      function updateTimeline(t, scale) {
        let active = 0;
        if (t >= TAP_AT) active = 1;
        if (t >= REVEAL_END) active = 2;
        if (t >= PULSE_AT) active = 3;
        if (scale > .12) active = 4;
        if (scale > 24) active = 5;
        if (t >= zoomEnd) active = 6;
        steps.forEach((step,i) => {
          step.classList.toggle('is-active', i === active);
          step.classList.toggle('is-done', i < active);

      }
      function updateCaption(t, scale) {
        let message;
        if (t < TAP_AT) message = '위치 보내기 버튼을 누르면 지구본이 나타납니다.';
        else if (t < REVEAL_END) message = '버튼에서 검은 배경이 퍼지며 지구본이 나타납니다.';
        else if (t < PULSE_AT) message = '지구본이 나타나고 광화문 방향을 찾습니다.';
        else if (t < DROP_AT) message = '광화문 위치를 알리는 펄스가 퍼집니다.';
        else if (t < zoomStart) message = '펄스 뒤에 토끼가 나타나 위치에 안착합니다.';
        else if (scale <= .12) message = '토끼와 함께 지구본에서 한반도로 확대됩니다.';
        else if (scale <= 24) message = '서울의 길과 녹지가 이어지며 광화문으로 들어갑니다.';
        else if (t < zoomEnd) message = '광화문·경복궁 주변으로 확대되고 버튼이 채워집니다.';
        else message = '광화문 주변 동네 지도로 확대를 마쳤습니다.';

      let startTime = 0, raf = 0, lastDraw = -Infinity;

        const scale = Math.exp(lerp(Math.log(.026), Math.log(520), z));

      function start() {

        button.classList.remove('is-pressed','is-filling','is-done');
        button.style.setProperty('--pb-pin-top','0%');
        wavePaths.forEach(path => path.style.strokeDashoffset = '0');
        mapLayer.style.setProperty('--pb-reveal','0px');
        updateButton(0); updateMarker(0); updateTimeline(0,.026); updateCaption(0,.026);
        finger.classList.remove('is-active'); touch.classList.remove('is-active');

      document.getElementById('pb-replay').addEventListener('click', start);
      buildTexture(); buildIcons(); start();
    })();
  </script>
